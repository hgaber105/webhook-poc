name: Trigger auto deployment for app-webhook-poc

on:
  push:
    branches: 
      [ main ]

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Log in to container registry
        uses: azure/docker-login@v1
        with:
          login-server: acrwebhookpoc2026.azurecr.io
          username: ${{ secrets.APPWEBHOOKPOC_REGISTRY_USERNAME }}
          password: ${{ secrets.APPWEBHOOKPOC_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: acrwebhookpoc2026.azurecr.io/app-webhook-poc:latest

      - name: Update Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: acrwebhookpoc2026
          containerAppName: app-webhook-poc
          resourceGroup: rg-webhook-poc
          imageToBuild: acrwebhookpoc2026.azurecr.io/app-webhook-poc:latest
          registryUsername: ${{ secrets.APPWEBHOOKPOC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPWEBHOOKPOC_REGISTRY_PASSWORD }}
