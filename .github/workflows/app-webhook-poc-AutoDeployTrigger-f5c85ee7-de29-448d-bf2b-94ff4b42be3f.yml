name: Trigger auto deployment for app-webhook-poc

on:
  push:
    branches: 
      [ main ]

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Log in to container registry
        uses: azure/docker-login@v1
        with:
          login-server: acrwebhookpoc2026.azurecr.io
          username: ${{ secrets.APPWEBHOOKPOC_REGISTRY_USERNAME }}
          password: ${{ secrets.APPWEBHOOKPOC_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: acrwebhookpoc2026.azurecr.io/app-webhook-poc:latest

      - name: Update Container App using Azure CLI
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name app-webhook-poc \
              --resource-group rg-webhook-poc \
              --image acrwebhookpoc2026.azurecr.io/app-webhook-poc:latest \
              --registry-server acrwebhookpoc2026.azurecr.io \
              --registry-username ${{ secrets.APPWEBHOOKPOC_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.APPWEBHOOKPOC_REGISTRY_PASSWORD }}
